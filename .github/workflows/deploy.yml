name: Deploy SWGAudit

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        required: true
        default: dev

concurrency:
  group: swgaudit-production-deploy
  cancel-in-progress: false

jobs:
  verify:
    name: Verify static site before deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Validate static source
        run: bash scripts/check-static-export.sh

      - name: Start local static server
        run: |
          python3 -m http.server 3333 > /tmp/swgaudit-static.log 2>&1 &
          echo $! > /tmp/swgaudit-static.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3333/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/swgaudit-static.log
          exit 1

      - name: Run HTTP smoke tests
        run: BASE_URL=http://127.0.0.1:3333 bash scripts/smoke-test.sh

  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: verify
    environment: production
    timeout-minutes: 8

    steps:
      - name: Validate deploy secret
        run: |
          if [ -z "${{ secrets.SWGAUDIT_DEPLOY_KEY }}" ]; then
            echo "Missing GitHub Actions secret: SWGAUDIT_DEPLOY_KEY"
            exit 1
          fi

      - name: Prepare SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SWGAUDIT_DEPLOY_KEY }}" > ~/.ssh/swgaudit_deploy_key
          chmod 600 ~/.ssh/swgaudit_deploy_key
          ssh-keyscan -T 10 -p 7575 167.71.228.73 >> ~/.ssh/known_hosts

      - name: Run server deploy script
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/swgaudit_deploy_key -p 7575 root@167.71.228.73 "BRANCH='${{ inputs.branch }}' deploy-swgaudit-main"
